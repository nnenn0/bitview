[package]
name = "bitview"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A small functional language that builds HTML from data"
license = "MIT"
repository = "https://github.com/nnenn0/bitview"
readme = "README.md"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
